<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../css/register.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../js/register.js" defer></script>
    <title>Register</title>
</head>
<body>
    <div>
        <button type="button" class="btn btn-primary">Home</button>
    </div>
    <div class="Logo">
        <img src="../assets/logo.png" alt="Logo image" width="250" height ="200">
    </div>
    <form id="registerForm">
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="floatingInput" placeholder="username">
            <label for="floatingInput">Username</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Password</label>
        </div>
        <div class="dateEntry">
            <label for="startDate">Age</label>
            <input id="startDate" class="form-control" type="date" />
        </div>
        <div class="register">
            <p id="error">This user already <strong>exists</strong></p>
            <button id="registerButt" type="submit" class="btn btn-secondary">Register</button>
        </div>
    </form>

</body>
</html>
