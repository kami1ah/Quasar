<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="../css/login.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" defer></script>
    <script src="../js/login.js" defer></script>
    <title>Log in</title>
</head>
<body>
    <div>
        <button id="home" type="button" class="btn btn-primary">Home</button>
    </div>
    <div class="Logo">
        <img src="../assets/logo.png" alt="Logo image" width="250" height ="200">
    </div>
    <form id="inputForm">
        <div class="form-floating mb-3">
            <input type="text" class="form-control" id="floatingInput" placeholder="Username">
            <label for="floatingInput">Username</label>
        </div>
        <div class="form-floating">
            <input type="password" class="form-control" id="floatingPassword" placeholder="Password">
            <label for="floatingPassword">Password</label>
        </div>
        <div class="logInButt">
            <button id="login" type="submit" class="btn btn-secondary">Log-in</button>
        </div>
    </form>
    <div >
        <p class="register">if you do not have an account, <a href="register.html">register here</a>
        </p>
    </div>
    <div class="error">
        <p id="loginError" hidden >The entered username or password is <strong>incorrect</strong></p>
    </div>
    
</body>
</html>
