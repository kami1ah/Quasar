<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Log in</title>
</head>
<body>
    <header>
        <h1>Log in</h1>
    </header>
    <hr>
    <main class="container text-center">
        <div class="row" class="col align-self-center">
            <form>
                <div id="login-form" class="card" style="width: 18rem;">
                    <div class="card-title">
                        <fieldset class="card-title">
                            <label for="username"> Username:</label>
                            <input type="text" id="username" name="username">
                        </fieldset>
                    </div>
                </div>
                <fieldset>
                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password">
                </fieldset>
                <input type="submit" value="Log in" class="btn btn-primary">
                
            </form>
        <p>
            Don't have an account?
            <a href="./register.html" class="btn btn-primary">Register here</a>
        </p>
    </main>
    
</body>
</html>
